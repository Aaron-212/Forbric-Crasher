name: Draft release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "25"
          cache: gradle

      - name: Compile universal mod JAR
        run: ./gradlew universalJar

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" build/libs/*.jar \
            --draft \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes
