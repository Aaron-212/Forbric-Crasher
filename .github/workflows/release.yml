name: Draft release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (e.g. v1.2.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Java 25
        uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: "25"
          cache: gradle

      - name: Compile universal mod JAR
        run: ./gradlew universalJar "-Pmod_version=$RELEASE_TAG"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" build/libs/*.jar \
            --draft \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes
